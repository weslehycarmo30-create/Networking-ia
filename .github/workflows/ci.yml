name: CI

# Lint (tsc), unit tests (node:test) and production build on every PR and on the work branch.
on:
  pull_request:
  push:
    branches: [codex/olimpo-002-foundation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test relies on Node's built-in TypeScript type stripping and module.registerHooks.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
